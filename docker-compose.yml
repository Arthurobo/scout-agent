services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: scout
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - scout_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  scout_pg:
